name: Update Govt Jobs Data

# Runs automatically every day at 6:00 AM IST (00:30 UTC),
# and can also be triggered manually from the Actions tab any time.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated jobs.json
        run: |
          git config user.name "govt-jobs-bot"
          git config user.email "actions@github.com"
          git add jobs.json
          git diff --quiet --cached || git commit -m "Auto-update jobs.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
